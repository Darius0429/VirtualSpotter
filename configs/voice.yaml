sample_rate_hz: 16000        # Whisper and the Vosk models are 16 kHz mono
poll_hz: 50                  # button polling
talk:
  mode: HOLD                 # HOLD = record while held; TOGGLE = press to start, press to stop
  max_s: 15.0                # recording is cut here
filter:
  min_audio_s: 0.4           # shorter recordings are dropped (accidental press)
  min_words: 2               # fewer words are dropped (noise is often heard as "the")
button:
  kind: joystick             # joystick | keyboard
  device_name: "La Prima Wheel"            # joystick: part of the name printed by scripts/setup_voice.py button
  button: 8                  # joystick: button index printed by the same script
  key_vk: 123                # Windows virtual-key code used when kind is keyboard (123 = F12)
microphone:
  device: null               # null = Windows default input; else index or name from scripts/setup_voice.py microphones
stt:
  engine: whisper            # whisper (local, free) | elevenlabs (API) | vosk (local, weakest)
  recordings: data/voice     # every question is kept here as a WAV file named after what was heard
elevenlabs_stt:
  model: scribe_v2
  language: en
vosk:
  model_dir: models/vosk-model-en-us-0.22-lgraph
whisper:
  model: base.en             # faster-whisper model, downloaded on first use; small.en is 3x slower and no better here
  compute_type: int8
  prompt: >-                 # words the driver uses; the model leans towards them
    Race engineer radio in Le Mans Ultimate. Words used: pit, box, stint, undercut, overcut, lift and coast,
    virtual energy, fuel, tyre temps, pressures, lock up, GT3 traffic, Hypercar, LMP2, P2, turn ten, apex, sector,
    did someone hit me, contact, crash, catch the car ahead, losing time, fastest lap overall, slow in turn thirteen.
tts:
  engine: radio              # radio = ElevenLabs voice with the radio sound added locally; print = text on screen only
  api_key_env: TTS_API_KEY   # environment variable that holds the ElevenLabs key
  voice_id: JBFqnCBsd6RMkjVDRZzb   # ElevenLabs voice (George, British)
  model: eleven_flash_v2_5   # the fast model: about 0.4 s for a radio message
  sample_rate_hz: 22050      # PCM rate asked for and played
  device: null               # output device; null = Windows default; else index or name from scripts/setup_voice.py
  radio:                     # the radio sound, added in code so it is the same every time
    low_hz: 350.0            # the band the radio passes
    high_hz: 3000.0
    drive: 6.0               # gain into the soft clipper; higher is more distorted
    level: 0.6               # loudness of the voice
    hiss: 0.012              # noise under the voice
    static_level: 0.25       # loudness of the static bursts
    static_in_s: 0.22        # static before the voice
    static_out_s: 0.15       # static after the voice
