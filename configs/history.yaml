sessions_root: data/sessions            # one YAML summary per session
history_file: data/history/sessions.jsonl   # one line of figures per session, append-only
refresh_s: 60.0                         # s between rewrites of the running session's summary
period_s: 1.0                           # s between checks for a new or ended session
class_top: 5                            # cars of the class listed in a summary (plus the player's neighbours)
track_field: TrackCourse                # results-file field equal to the game's track name (TrackVenue is equal too)
results_margin_s: 300.0                 # s a results file's start may differ from the start the engineer saw
timeline:
  resume_margin_s: 120.0     # s two session starts may differ and still be the same session (restart of the engineer)
  max_entries: 30            # entries the agent tool returns at most (newest kept)
  answer_chars: 160          # characters of an answer kept in a question entry's text
  builder:
    yellow_clear_hold_s: 3.0   # session s a sector must stay clear before the clear is recorded
    position_hold_s: 5.0       # session s a swap in class must hold before it is recorded
    min_best_lap_gain_s: 0.1   # s a best lap must improve on the last recorded one
    min_energy_change: 0.02    # fraction of energy the first-stop amount must move to count as a plan change
    min_fuel_change_l: 1.0     # litres the first-stop amount of a car without virtual energy must move
    rival_groups: [ahead, behind, strategy]   # rival groups whose members are recorded (set changes, pit stops)
    plan_place_hold_laps: 2    # consecutive lap checks a new projected class place must hold to count as a plan change
    rival_hold_s: 30.0         # session s a car must be in, or out of, the rival set before that is recorded
