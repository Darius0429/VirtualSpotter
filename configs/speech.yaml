poll_hz: 20
gate:
  urgent_priority: SPOTTER   # Priority name; at or above is spoken at once
  max_age_s: 15.0            # queued non-urgent messages older than this are dropped
straight:                    # live detector, also labels samples for learning
  max_steering: 0.08         # |steering| fraction of lock
  max_lateral_mps2: 5.0
  min_speed_mps: 30.0
  hold_s: 1.0
learned:
  learn_laps: 3              # clean laps before the learned straights take over
  bin_m: 20.0                # lap-distance bin (scoring lap distance steps at 5 Hz)
  min_fraction: 0.8          # share of a bin's samples that must be straight
  min_length_m: 150.0        # shorter straights are dropped
  min_remaining_s: 4.0       # straight time that must be left to start speaking
